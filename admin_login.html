{% extends "base.html" %}
{% block title %}Admin Login | SkyBook{% endblock %}
{% block content %}
<div class="auth-wrap py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="auth-card p-5">
          <div class="text-center mb-4">
            <i class="fa-solid fa-user-shield fa-2x gold-text"></i>
            <h4 class="fw-bold mt-2">Admin Login</h4>
            <p class="text-muted small">Restricted access — SkyBook staff only</p>
          </div>
          <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-navy w-100"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
