{% extends "base.html" %}
{% block title %}Edit Profile | SkyBook{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="search-card" style="margin-top:0;">
        <h4 class="fw-bold mb-4"><i class="fa-solid fa-user-pen gold-text"></i> Edit Profile</h4>
        <form method="POST" class="needs-validation" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" value="{{ user.username }}" disabled>
            <div class="form-text">Username cannot be changed.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="fullname" class="form-control" value="{{ user.fullname }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" name="password" class="form-control" minlength="8" placeholder="Leave blank to keep current password">
          </div>
          <button type="submit" class="btn btn-navy w-100"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
